services:
    app:
        build: .
        ports:
            - "8000:8000"
        volumes:
            - .:/var/www
            - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/docker-php-ext-opcache.ini
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: spk
            DB_USERNAME: spk
            DB_PASSWORD: secret
        command: php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started

    mysql:
        image: mysql:8.0
        ports:
            - "3306:3306"
        environment:
            MYSQL_DATABASE: spk
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_USER: spk
            MYSQL_PASSWORD: secret
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD",
                    "mysqladmin",
                    "ping",
                    "-h",
                    "localhost",
                    "-uroot",
                    "-psecret",
                ]
            interval: 5s
            timeout: 5s
            retries: 20
    redis:
        image: redis:alpine
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data

volumes:
    mysql_data:
    redis_data:
